name: Build Kodi Android ARM64
on:
  workflow_dispatch:
  push:
    branches: [feature/kodi-arm64-lixtv]
jobs:
  kodi-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: lixtv
      - uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          # Tag estavel; nao acompanhar master sem validacao da cadeia de build.
          ref: 21.3-Omega
          path: kodi
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison build-essential curl default-jdk flex gawk git gperf lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev libtool pkg-config python3 unzip zip zlib1g-dev cmake ninja-build gettext
      - name: Install Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;33.0.1" "ndk;21.4.7075529"
      - name: Build native Kodi ARM64
        env:
          KODI_SRC: ${{ github.workspace }}/kodi
          ANDROID_NDK_HOME: ${{ android_home }}/ndk/21.4.7075529
          WORK_ROOT: ${{ github.workspace }}/out
          BUILD_JOBS: '2'
        run: bash lixtv/kodi-edition/native/build-arm64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Kodi-ARM64-upstream-test
          path: out/artifacts/
          if-no-files-found: error
